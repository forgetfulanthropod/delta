name: E2E (playwrong)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwrong:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxtst-dev \
            xvfb \
            google-chrome-stable

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Setup playwrong
        run: bash scripts/setup-playwrong.sh

      - name: Run playwrong e2e
        run: pnpm test:e2e
        env:
          PLAYWRONG_XVFB: '1'
          PLAYWRONG_PHYSICAL_CLICK: '1'